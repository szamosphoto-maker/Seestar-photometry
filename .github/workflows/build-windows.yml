name: Build Seestar Photometry Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Seestar_Photometry
          --icon Seestar_Photometry.ico
          --collect-all astropy
          --collect-all matplotlib
          seestar_photometry_gui.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Seestar_Photometry_Windows
          path: dist/Seestar_Photometry.exe
          if-no-files-found: error
